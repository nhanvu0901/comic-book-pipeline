<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
  <title id="t">Video formats</title>
  <desc id="d">Five format cards deal onto the table one after another: Recap, Micro moment, Q&amp;A, Panel walk and Screen Q&amp;A.</desc>
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.4" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .deal { animation: deal .65s cubic-bezier(.2,.9,.25,1.2) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; } .d5 { animation-delay: 1.1s; }
    .bob { animation: bob 4s ease-in-out infinite; }
    .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; } .b5 { animation-delay: 2.4s; }
    .h { font-family: 'Bangers','Impact','Arial Black',system-ui,sans-serif; font-size: 26px; letter-spacing: 1px; fill: #0d0d12; }
    .s { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; font-size: 14px; fill: #2b2735; }
    .len { font-family: system-ui,-apple-system,'Segoe UI',sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    @keyframes deal { from { opacity: 0; transform: translateY(-60px) rotate(-10deg) scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="250" rx="18" fill="#121018"/>
  <rect width="1200" height="250" rx="18" fill="url(#dots)"/>

  <g class="deal d1"><g class="bob">
    <rect x="30" y="35" width="210" height="180" rx="14" fill="#ffd166" stroke="#0d0d12" stroke-width="4"/>
    <text class="h" x="50" y="85">RECAP</text>
    <text class="s" x="50" y="115">A whole issue,</text><text class="s" x="50" y="135">told start to end</text>
    <rect x="50" y="165" width="96" height="28" rx="14" fill="#0d0d12"/><text class="len" x="98" y="184" text-anchor="middle">60–76 s</text>
  </g></g>

  <g class="deal d2"><g class="bob b2">
    <rect x="262" y="35" width="210" height="180" rx="14" fill="#ff8fa3" stroke="#0d0d12" stroke-width="4"/>
    <text class="h" x="282" y="85">MICRO MOMENT</text>
    <text class="s" x="282" y="115">One scene, its setup,</text><text class="s" x="282" y="135">and how it ends</text>
    <rect x="282" y="165" width="96" height="28" rx="14" fill="#0d0d12"/><text class="len" x="330" y="184" text-anchor="middle">30–50 s</text>
  </g></g>

  <g class="deal d3"><g class="bob b3">
    <rect x="494" y="35" width="210" height="180" rx="14" fill="#7ee0c3" stroke="#0d0d12" stroke-width="4"/>
    <text class="h" x="514" y="85">Q&amp;A</text>
    <text class="s" x="514" y="115">"Every time X…"</text><text class="s" x="514" y="135">answers across comics</text>
    <rect x="514" y="165" width="120" height="28" rx="14" fill="#0d0d12"/><text class="len" x="574" y="184" text-anchor="middle">main format</text>
  </g></g>

  <g class="deal d4"><g class="bob b4">
    <rect x="726" y="35" width="210" height="180" rx="14" fill="#9ab8ff" stroke="#0d0d12" stroke-width="4"/>
    <text class="h" x="746" y="85">PANEL WALK</text>
    <text class="s" x="746" y="115">Panel-by-panel,</text><text class="s" x="746" y="135">long-form pace</text>
    <rect x="746" y="165" width="96" height="28" rx="14" fill="#0d0d12"/><text class="len" x="794" y="184" text-anchor="middle">long-form</text>
  </g></g>

  <g class="deal d5"><g class="bob b5">
    <rect x="958" y="35" width="210" height="180" rx="14" fill="#d3a4ff" stroke="#0d0d12" stroke-width="4"/>
    <text class="h" x="978" y="85">SCREEN Q&amp;A</text>
    <text class="s" x="978" y="115">Film and TV canon,</text><text class="s" x="978" y="135">cited by title + year</text>
    <rect x="978" y="165" width="96" height="28" rx="14" fill="#0d0d12"/><text class="len" x="1026" y="184" text-anchor="middle">agent-first</text>
  </g></g>
</svg>
