[pytest]
# Collect only the real suite. With no config, a bare `pytest` recursed into scratch/ and
# scripts/, whose test_*.py files are manual scripts that do their work at import time —
# one re-ran a live URL-direct download into a real project, others made paid You.com
# and OpenRouter calls — on every full run.
testpaths = tests
norecursedirs = .* __pycache__ scratch scripts projects art_projects research_sessions
                node_modules venv .venv build dist
